<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Usługi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A3A5A}a:hover{color:#6E2A46}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F4; color: #221C19; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 24px 32px;">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
    <a href="Salon.dc.html" aria-label="Wstecz" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 12px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#221C19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 14px; color: #6E655F;">4 z 6</span>
  </div>
  <div style="height: 4px; border-radius: 2px; background: #EAE3DD; margin-top: 12px;"><div style="width: 67%; height: 4px; border-radius: 2px; background: {{accent}};"></div></div>

  <h1 style="margin: 32px 0 6px; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em;">Co robicie?</h1>
  <p style="margin: 0; font-size: 17px; color: #6E655F;">Zaznacz. Czas zmienisz później.</p>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 24px;">
    <sc-for list="{{services}}" as="s" hint-placeholder-count="7">
      <sc-if value="{{s.on}}" hint-placeholder-val="{{true}}">
        <button style="height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border: 1.5px solid {{accent}}; border-radius: 14px; background: #FFFFFF; color: #221C19; cursor: pointer; text-align: left;">
          <span style="width: 26px; height: 26px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          </span>
          <span style="flex-grow: 1; font-size: 17px; font-weight: 600;">{{s.name}}</span>
          <span style="font-size: 15px; color: #6E655F;">{{s.min}} min</span>
        </button>
      </sc-if>
      <sc-if value="{{s.off}}" hint-placeholder-val="{{false}}">
        <button style="height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border: 1.5px solid #E0D8D1; border-radius: 14px; background: #FFFFFF; color: #221C19; cursor: pointer; text-align: left;">
          <span style="width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid #C9BFB7; box-sizing: border-box; flex-shrink: 0;"></span>
          <span style="flex-grow: 1; font-size: 17px; font-weight: 500;">{{s.name}}</span>
          <span style="font-size: 15px; color: #6E655F;">{{s.min}} min</span>
        </button>
      </sc-if>
    </sc-for>
    <button style="height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border: 1.5px dashed #C9BFB7; border-radius: 14px; background: transparent; color: {{accent}}; font-size: 17px; font-weight: 600; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Dodaj swoją
    </button>
  </div>

  <div style="flex-grow: 1;"></div>

  <a href="Zespol.dc.html" style="height: 56px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">Dalej · 4 usługi</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A3A5A","options":["#8A3A5A","#2F5D62","#3B4A8C","#9A5B2E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['Strzyżenie damskie', 60, true],
      ['Strzyżenie męskie', 30, true],
      ['Koloryzacja', 120, true],
      ['Modelowanie', 45, true],
      ['Manicure hybrydowy', 60, false],
      ['Pedicure', 60, false],
      ['Brwi i rzęsy', 30, false]
    ];
    return {
      accent: this.props.accent ?? '#8A3A5A',
      services: list.map(([name, min, on]) => ({ name, min, on, off: !on }))
    };
  }
}
</script>
</body>
</html>
