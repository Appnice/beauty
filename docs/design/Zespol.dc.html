<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zespół</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A3A5A}a:hover{color:#6E2A46}
input,button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F4; color: #221C19; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 24px 32px;">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
    <a href="Uslugi.dc.html" aria-label="Wstecz" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 12px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#221C19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 14px; color: #6E655F;">5 z 6</span>
  </div>
  <div style="height: 4px; border-radius: 2px; background: #EAE3DD; margin-top: 12px;"><div style="width: 83%; height: 4px; border-radius: 2px; background: {{accent}};"></div></div>

  <h1 style="margin: 32px 0 6px; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em;">Kto pracuje?</h1>
  <p style="margin: 0; font-size: 17px; color: #6E655F;">Każda osoba to kolumna w kalendarzu.</p>

  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 24px;">
    <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
      <div style="height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 8px 0 14px; border: 1.5px solid #E0D8D1; border-radius: 14px; background: #FFFFFF;">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: {{p.bg}}; color: {{p.ink}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; flex-shrink: 0;">{{p.initial}}</span>
        <span style="flex-grow: 1; font-size: 17px; font-weight: 600;">{{p.name}}</span>
        <span style="font-size: 14px; color: #6E655F;">{{p.note}}</span>
        <button aria-label="Usuń" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A918A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
    </sc-for>
    <div style="height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; border: 1.5px solid {{accent}}; border-radius: 14px; background: #FFFFFF;">
      <input aria-label="Imię" value="" placeholder="Imię" style="flex-grow: 1; min-width: 0; border: 0; font-size: 17px; color: #221C19; outline: none; background: transparent;">
      <button style="height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: #F3E4EA; color: {{accent}}; font-size: 16px; font-weight: 600; cursor: pointer;">Dodaj</button>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <a href="Godziny.dc.html" style="height: 56px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">Dalej</a>
  <p style="margin: 16px 0 0; text-align: center; font-size: 15px; color: #6E655F;">Pracujesz sama? Też dobrze.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A3A5A","options":["#8A3A5A","#2F5D62","#3B4A8C","#9A5B2E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#8A3A5A',
      people: [
        { name: 'Ola', initial: 'O', note: 'Ty', bg: '#F6DDE6', ink: '#6B2442' },
        { name: 'Kasia', initial: 'K', note: '', bg: '#DCE7F5', ink: '#1F3B63' },
        { name: 'Magda', initial: 'M', note: '', bg: '#E1EDDD', ink: '#2D4A29' }
      ]
    };
  }
}
</script>
</body>
</html>
