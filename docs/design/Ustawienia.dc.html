<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Ustawienia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A3A5A}a:hover{color:#6E2A46}
button{font:inherit}
</style>
</helmet>
<div style="width: 1024px; height: 768px; box-sizing: border-box; background: #FAF7F4; color: #221C19; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex;">

  <nav aria-label="Menu" style="width: 88px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #EAE3DD; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 6px;">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin-bottom: 18px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
    </span>
    <a href="Kalendarz.dc.html" style="width: 72px; height: 64px; border-radius: 14px; color: #6E655F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
      Kalendarz
    </a>
    <a href="Czekaja.dc.html" style="position: relative; width: 72px; height: 64px; border-radius: 14px; color: #6E655F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      Czekają
      <span style="position: absolute; top: 6px; right: 14px; min-width: 20px; height: 20px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span>
    </a>
    <a href="Ustawienia.dc.html" style="width: 72px; height: 64px; border-radius: 14px; background: #F3E4EA; color: {{accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      Ustawienia
    </a>
  </nav>

  <main style="flex-grow: 1; min-width: 0; padding: 28px 40px;">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em;">Studio Ola</h1>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px;">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
        <button style="height: 96px; display: flex; align-items: center; gap: 16px; padding: 0 20px; border: 1.5px solid #E0D8D1; border-radius: 18px; background: #FFFFFF; text-align: left; cursor: pointer;">
          <span style="width: 48px; height: 48px; border-radius: 14px; background: #F3E4EA; color: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
            <span style="font-size: 18px; font-weight: 700; color: #221C19;">{{t.title}}</span>
            <span style="font-size: 15px; color: #6E655F;">{{t.sub}}</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A918A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px;">
      <div style="padding: 20px; border: 1.5px solid #E0D8D1; border-radius: 18px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px;">
        <span style="font-size: 18px; font-weight: 700;">Nowe rezerwacje</span>
        <div role="radiogroup" aria-label="Nowe rezerwacje" style="display: flex; flex-direction: column; gap: 8px;">
          <button role="radio" aria-checked="true" style="height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border: 2px solid {{accent}}; border-radius: 14px; background: #FFFFFF; font-size: 16px; font-weight: 600; color: #221C19; cursor: pointer; text-align: left;">
            <span style="width: 20px; height: 20px; border-radius: 10px; border: 6px solid {{accent}}; box-sizing: border-box;"></span>Wpadają od razu
          </button>
          <button role="radio" aria-checked="false" style="height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border: 1.5px solid #E0D8D1; border-radius: 14px; background: #FFFFFF; font-size: 16px; font-weight: 500; color: #221C19; cursor: pointer; text-align: left;">
            <span style="width: 20px; height: 20px; border-radius: 10px; border: 1.5px solid #C9BFB7; box-sizing: border-box;"></span>Czekają na mnie
          </button>
        </div>
      </div>

      <div style="padding: 20px; border: 1.5px solid #E0D8D1; border-radius: 18px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px;">
        <span style="font-size: 18px; font-weight: 700;">SMS w listopadzie</span>
        <span style="font-size: 32px; font-weight: 700; letter-spacing: -0.02em;">142 <span style="font-size: 18px; font-weight: 500; color: #6E655F;">z 300</span></span>
        <div style="height: 10px; border-radius: 5px; background: #EFE9E4;"><div style="width: 47%; height: 10px; border-radius: 5px; background: {{accent}};"></div></div>
        <span style="font-size: 15px; color: #6E655F;">Przypomnienia o wizytach i kody.</span>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A3A5A","options":["#8A3A5A","#2F5D62","#3B4A8C","#9A5B2E"]},"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#8A3A5A',
      tiles: [
        { title: 'Usługi', sub: '4 usługi', icon: 'M6 3l12 12M6 15l12-12M4 18a2 2 0 1 0 4 0a2 2 0 1 0-4 0M16 18a2 2 0 1 0 4 0a2 2 0 1 0-4 0' },
        { title: 'Zespół', sub: 'Ola, Kasia, Magda, Ewa', icon: 'M9 11a4 4 0 1 0 0-8a4 4 0 0 0 0 8M2 21a7 7 0 0 1 14 0M17 3a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3' },
        { title: 'Godziny otwarcia', sub: 'pn–pt 9–18, sob 9–14', icon: 'M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18M12 7v5l3 2' },
        { title: 'Link do zapisów', sub: 'beauty.appnice.dev/studio-ola', icon: 'M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1' }
      ]
    };
  }
}
</script>
</body>
</html>
