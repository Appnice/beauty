<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Czekają na potwierdzenie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A3A5A}a:hover{color:#6E2A46}
button{font:inherit}
</style>
</helmet>
<div style="width: 1024px; height: 768px; box-sizing: border-box; background: #FAF7F4; color: #221C19; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex;">

  <nav aria-label="Menu" style="width: 88px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #EAE3DD; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 6px;">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center; margin-bottom: 18px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
    </span>
    <a href="Kalendarz.dc.html" style="width: 72px; height: 64px; border-radius: 14px; color: #6E655F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
      Kalendarz
    </a>
    <a href="Czekaja.dc.html" style="position: relative; width: 72px; height: 64px; border-radius: 14px; background: #F3E4EA; color: {{accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      Czekają
      <span style="position: absolute; top: 6px; right: 14px; min-width: 20px; height: 20px; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span>
    </a>
    <a href="Ustawienia.dc.html" style="width: 72px; height: 64px; border-radius: 14px; color: #6E655F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; text-decoration: none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      Ustawienia
    </a>
  </nav>

  <main style="flex-grow: 1; min-width: 0; padding: 28px 40px;">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em;">Czekają na Ciebie <span style="color: #6E655F; font-weight: 600;">2</span></h1>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px; max-width: 760px;">
      <sc-for list="{{items}}" as="v" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 16px; padding: 18px 18px 18px 20px; border: 1.5px solid #E0D8D1; border-radius: 18px; background: #FFFFFF;">
          <div style="width: 64px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center;">
            <span style="font-size: 13px; font-weight: 600; color: #6E655F;">{{v.dow}}</span>
            <span style="font-size: 26px; font-weight: 700; line-height: 1.1;">{{v.day}}</span>
            <span style="font-size: 13px; color: #6E655F;">{{v.month}}</span>
          </div>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: 18px; font-weight: 700;">{{v.time}} · {{v.service}}</span>
            <span style="font-size: 15px; color: #6E655F;">{{v.client}} · {{v.phone}}</span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: {{v.ink}};">
              <span style="width: 10px; height: 10px; border-radius: 5px; background: {{v.dot}};"></span>{{v.staff}}
            </span>
          </div>
          <button style="height: 52px; padding: 0 20px; border: 1.5px solid #E0D8D1; border-radius: 14px; background: #FFFFFF; color: #221C19; font-size: 16px; font-weight: 600; cursor: pointer;">Odrzuć</button>
          <button style="height: 52px; padding: 0 22px; border: 0; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
            Przyjmij
          </button>
        </div>
      </sc-for>
    </div>
    <p style="margin: 20px 0 0; font-size: 15px; color: #6E655F;">Klient dostanie SMS od razu.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A3A5A","options":["#8A3A5A","#2F5D62","#3B4A8C","#9A5B2E"]},"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#8A3A5A',
      items: [
        { dow: 'śr', day: '12', month: 'lis', time: '16:00', service: 'Strzyżenie damskie', client: 'Natalia Bąk', phone: '512 448 019', staff: 'Kasia', dot: '#4F7CB8', ink: '#1C3558' },
        { dow: 'czw', day: '13', month: 'lis', time: '10:00', service: 'Koloryzacja', client: 'Monika Sikora', phone: '698 301 552', staff: 'Ola', dot: '#C2577F', ink: '#5E1F3A' }
      ]
    };
  }
}
</script>
</body>
</html>
