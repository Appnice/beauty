<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Godziny otwarcia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A3A5A}a:hover{color:#6E2A46}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F4; color: #221C19; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 24px 32px;">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
    <a href="Zespol.dc.html" aria-label="Wstecz" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; border-radius: 12px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#221C19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 14px; color: #6E655F;">6 z 6</span>
  </div>
  <div style="height: 4px; border-radius: 2px; background: #EAE3DD; margin-top: 12px;"><div style="width: 100%; height: 4px; border-radius: 2px; background: {{accent}};"></div></div>

  <h1 style="margin: 32px 0 6px; font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em;">Kiedy otwarte?</h1>
  <p style="margin: 0; font-size: 17px; color: #6E655F;">Stuknij godzinę, żeby zmienić.</p>

  <div style="display: flex; flex-direction: column; margin-top: 20px; border: 1.5px solid #E0D8D1; border-radius: 16px; background: #FFFFFF; overflow: hidden;">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <div style="height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid #F0EAE5;">
        <span style="width: 92px; font-size: 17px; font-weight: 600; color: {{d.dayColor}};">{{d.day}}</span>
        <sc-if value="{{d.open}}" hint-placeholder-val="{{true}}">
          <button style="flex-grow: 1; height: 40px; border: 0; border-radius: 10px; background: #F5F0EC; color: #221C19; font-size: 16px; font-weight: 500; cursor: pointer;">{{d.hours}}</button>
        </sc-if>
        <sc-if value="{{d.closed}}" hint-placeholder-val="{{false}}">
          <span style="flex-grow: 1; text-align: center; font-size: 16px; color: #6E655F;">Zamknięte</span>
        </sc-if>
        <span role="img" aria-label="{{d.toggleLabel}}" style="width: 48px; height: 28px; border-radius: 14px; background: {{d.track}}; display: flex; align-items: center; justify-content: {{d.knobSide}}; padding: 3px; box-sizing: border-box; flex-shrink: 0;">
          <span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2);"></span>
        </span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1;"></div>

  <a href="Gotowe.dc.html" style="height: 56px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">Wyślij do akceptacji</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A3A5A","options":["#8A3A5A","#2F5D62","#3B4A8C","#9A5B2E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8A3A5A';
    const rows = [
      ['Poniedziałek', '9:00 – 18:00'],
      ['Wtorek', '9:00 – 18:00'],
      ['Środa', '9:00 – 18:00'],
      ['Czwartek', '10:00 – 20:00'],
      ['Piątek', '9:00 – 18:00'],
      ['Sobota', '9:00 – 14:00'],
      ['Niedziela', null]
    ];
    return {
      accent,
      days: rows.map(([day, hours]) => ({
        day, hours,
        open: !!hours, closed: !hours,
        dayColor: hours ? '#221C19' : '#6E655F',
        track: hours ? accent : '#D6CDC6',
        knobSide: hours ? 'flex-end' : 'flex-start',
        toggleLabel: hours ? 'Otwarte' : 'Zamknięte'
      }))
    };
  }
}
</script>
</body>
</html>
