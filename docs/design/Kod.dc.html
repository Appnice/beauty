<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF7F4; color: #221C19; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 24px 24px 32px;">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">

    <input aria-label="Cyfra 3" value="1" style="height: 64px; box-sizing: border-box; text-align: center; border: 1.5px solid #E0D8D1; border-radius: 14px; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #221C19; outline: none;">
    <input aria-label="Cyfra 4" value="" style="height: 64px; box-sizing: border-box; text-align: center; border: 2px solid {{accent}}; border-radius: 14px; background: #FFFFFF; font-size: 26px; font-weight: 600; color: #221C19; outline: none;">

  <div style="flex-grow: 1;"></div>

  <a href="Salon.dc.html" style="height: 56px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">Dalej</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A3A5A","options":["#8A3A5A","#2F5D62","#3B4A8C","#9A5B2E"]},"$preview":{"width":390,"height":844}}'>
